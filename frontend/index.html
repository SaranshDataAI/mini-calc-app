<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator-app">
      <section class="calculator" aria-label="Calculator">
        <div class="calculator__header">
          <span class="brand">mini calc</span>
          <span class="status-dot" aria-hidden="true"></span>
        </div>

        <div class="calculator__screen" aria-live="polite">
          <div class="screen__expression" id="expression">0</div>
          <div class="screen__value" id="result">0</div>
        </div>

        <div class="calculator__keypad">
          <button class="key key--function" data-action="clear">AC</button>
          <button class="key key--function" data-action="delete">DEL</button>
          <button class="key key--sqrt" data-action="sqrt">√</button>
          <button class="key key--operator" data-action="operator" data-value="divide">÷</button>
          <button class="key key--operator" data-action="operator" data-value="multiply">×</button>

          <button class="key key--number" data-value="7">7</button>
          <button class="key key--number" data-value="8">8</button>
          <button class="key key--number" data-value="9">9</button>
          <button class="key key--operator" data-action="operator" data-value="subtract">−</button>

          <button class="key key--number" data-value="4">4</button>
          <button class="key key--number" data-value="5">5</button>
          <button class="key key--number" data-value="6">6</button>
          <button class="key key--operator" data-action="operator" data-value="add">+</button>

          <button class="key key--number" data-value="1">1</button>
          <button class="key key--number" data-value="2">2</button>
          <button class="key key--number" data-value="3">3</button>
          <button class="key key--equals" id="calcBtn" data-action="calculate">=</button>

          <button class="key key--number key--wide" data-value="0">0</button>
          <button class="key key--decimal" data-value=".">.</button>
        </div>

        <p id="error" class="error" aria-live="polite"></p>
        <p class="keyboard-help">Keyboard: 0–9, . , +, −, ×, ÷, Enter/=, Backspace, Esc, R (√)</p>
      </section>

      <aside class="history-panel">
        <div class="history-panel__header">
          <h2>History</h2>
          <button type="button" class="clear-history-btn" id="clearHistoryBtn">Clear</button>
        </div>
        <ul id="history"></ul>
      </aside>

      <section class="converter-panel" aria-labelledby="converter-title">
        <div class="converter-panel__header">
          <h2 id="converter-title">Base converter</h2>
          <span>Integer values</span>
        </div>
        <label for="conversionValue">Value</label>
        <input
          id="conversionValue"
          type="text"
          inputmode="text"
          autocomplete="off"
          placeholder="e.g. 101101"
        />
        <div class="converter-panel__bases">
          <label for="sourceBase">From
            <select id="sourceBase">
              <option value="binary">Binary</option>
              <option value="octal">Octal</option>
              <option value="decimal">Decimal</option>
              <option value="hexadecimal">Hexadecimal</option>
            </select>
          </label>
          <label for="targetBase">To
            <select id="targetBase">
              <option value="binary">Binary</option>
              <option value="octal">Octal</option>
              <option value="decimal" selected>Decimal</option>
              <option value="hexadecimal">Hexadecimal</option>
            </select>
          </label>
        </div>
        <button type="button" id="convertBtn" class="convert-btn">Convert</button>
        <div class="conversion-result" aria-live="polite">
          <span>Result</span>
          <output id="conversionResult">—</output>
        </div>
        <p id="conversionError" class="error" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
